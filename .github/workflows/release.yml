# Publication, driven by the VERSION IN THE MANIFEST and gated by the same suite.
#
# The trigger is a merge into master, so nobody publishes from a laptop and nobody has to remember a
# tag. But a merge is not the decision — the decision is the version. This workflow asks the registry
# whether `name@version` already exists and publishes only when it does not, so an ordinary merge is
# a clean no-op and a merge that bumps the manifest is a release.
#
# WHY NOT SIMPLY PUBLISH ON EVERY MERGE: publishing is irreversible — a version on npm cannot be
# replaced, only deprecated — and npm refuses a duplicate, so "publish on merge" would paint every
# routine merge red for the one reason that is not a defect. The version bump is the release act, it
# lives in the pull request, and it gets reviewed like everything else.
name: Release

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # DELIBERATELY OUTSIDE THE ENVIRONMENT. The `npm` environment holds a required reviewer, and asking
  # a human to approve a run that has nothing to publish teaches them to approve without looking.
  decide:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.registry.outputs.publish }}
      version: ${{ steps.registry.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Ask the registry whether this version already exists
        id: registry
        run: |
          PKG="$(node -p "require('./package.json').name")"
          VER="$(node -p "require('./package.json').version")"
          CODE="$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/$PKG/$VER")"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          case "$CODE" in
            # A THIRD ANSWER IS NOT "NO". Treating every non-200 as absent would turn an outage into
            # a publish attempt, so anything but these two stops the run instead of guessing.
            200) echo "$PKG@$VER is already published — nothing to do"; echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "$PKG@$VER is not on the registry — releasing"; echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "the registry answered $CODE for $PKG@$VER — refusing to guess"; exit 1 ;;
          esac

  publish:
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      # NO DEPENDENCY CACHE HERE, deliberately, and this is npm's own guidance for release builds.
      # A cache is a store keyed by a lockfile hash, filled by an earlier run. On the gate that is a
      # speed-up worth having; on the one irreversible step in this repository it means the tarball
      # can be assembled from artefacts resolved by a different run. `ci.yml` keeps its cache.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Suite
        run: npm test

      # THE LAST THING BEFORE THE IRREVERSIBLE ONE. `ci.yml` runs this too, but without it here the
      # only run that actually publishes would be the only run that never checked what it ships.
      - name: Prove every promised path exists
        run: |
          npm pack --dry-run
          node scripts/verify-package-paths.mjs

      # `--provenance` publishes a signed attestation linking the tarball to this workflow run and to
      # this commit, so a consumer can verify the package came from this repository and not from
      # someone's laptop. It is also why no tag is created: the commit is recorded in the attestation,
      # so a tag would be a second, weaker record of the same fact.
      - name: Publish ${{ needs.decide.outputs.version }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
