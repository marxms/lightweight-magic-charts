# The gate, run on the same commands a contributor runs locally.
#
# WHY THESE AND NOT A GENERIC "lint, test, build": this library's guarantees are enforced BY the
# suite — the language gate, the derived-reference gate, the size budget and the boundary checks all
# live in `npm test`. A CI that ran something else would be weaker than the local gate, and a gate
# that can be weaker than the developer's own run is not a gate.
#
# ACTIONS ARE PINNED BY COMMIT, not by tag. A tag is a moving pointer its owner can repoint, and
# `release.yml` reuses these same actions in the job that holds the npm token — so a repointed tag
# there is a supply-chain compromise, not an inconvenience. The version is in the comment.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # NOT fail-fast. The reason is measured: `10 ** -4` is 0.0001 on one Node and
      # 0.00009999999999999999 on another, and that defect reached master because one version was
      # the only version. Cancelling the siblings the moment one fails would hide exactly that.
      fail-fast: false
      matrix:
        # Every Node still supported upstream on 2026-08-16: 22 (Jod, LTS to 2027-04), 24 (Krypton,
        # LTS to 2028-04), 26 (current, LTS from 2026-10). Node 20 is deliberately absent — it went
        # end-of-life on 2026-04-30, and gating on an unsupported runtime tests nobody's install.
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # This job never writes to the repository, so it has no use for a credential in the
          # workspace. Only the publish job asks for one, and only to record its tag.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # BUILD FIRST. The size budget and the derived reference both measure the BUILT entry, so a
      # suite run against a stale `dist` would assert against an artefact nobody is shipping.
      - name: Build
        run: npm run build

      - name: Suite (includes the language, reference, boundary and size-budget gates)
        run: npm test

      # The published tarball is part of the contract: `files` promises paths, and a promise that
      # resolves to nothing is a broken install for whoever consumes it. The check lives in a script
      # so the release workflow and a contributor can run the SAME one — see the script's docblock.
      - name: Pack, and prove every promised path exists
        run: |
          npm pack --dry-run
          node scripts/verify-package-paths.mjs

  # THE ONLY CHECK HERE THAT HAS EVER SEEN A PIXEL, and until now it had no home: it needed
  # `playwright-core`, which resolved by accident through the monorepo's app and vanished with the
  # extraction. That gap cost a real release — `0.1.0` shipped with a demo whose panel could not be
  # closed by keyboard, past a green suite and a green CI, because nothing rendered anything.
  #
  # A JOB OF ITS OWN, not a step on `gate`. It downloads a browser, which the gate must never need:
  # the gate has to stay runnable on a clean machine in seconds, and a matrix of three would pay for
  # the download three times to measure geometry that does not vary by Node version.
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # `--only-shell` fetches the headless shell rather than the full browser: this probe measures
      # layout, and nothing here needs a window.
      - name: Install the browser the probe drives
        run: npx playwright install --only-shell chromium

      - name: Layout probe (the geometry jsdom cannot produce)
        run: npm run layout-probe
