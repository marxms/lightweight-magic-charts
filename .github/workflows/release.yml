# Publication, driven by a TAG and gated by the same suite.
#
# The tag is the trigger rather than a push to master because publishing is irreversible: a version on
# npm cannot be replaced, only deprecated. Requiring an explicit `vX.Y.Z` makes the release an act,
# not a side effect of merging.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      # NO DEPENDENCY CACHE HERE, deliberately, and this is npm's own guidance for release builds.
      # A cache is a store keyed by a lockfile hash, filled by an earlier run. On the gate that is a
      # speed-up worth having; on the one irreversible step in this repository it means the tarball
      # can be assembled from artefacts resolved by a different run. `ci.yml` keeps its cache.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # The tag and the manifest must agree. They drift the moment someone tags without bumping, and
      # the result is a release whose name does not match what is inside it.
      - name: The tag must equal the version in package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json $PKG"
            exit 1
          fi
          echo "tag and manifest agree on $PKG"

      - name: Build
        run: npm run build

      - name: Suite
        run: npm test

      # THE LAST THING BEFORE THE IRREVERSIBLE ONE. `ci.yml` runs this too, but it triggers on pull
      # requests and on pushes to master — never on a tag. Without it here, the only run that
      # actually publishes is the only run that never checked what it is about to ship.
      - name: Prove every promised path exists
        run: |
          npm pack --dry-run
          node scripts/verify-package-paths.mjs

      # `--provenance` publishes a signed attestation linking the tarball to this workflow run, so a
      # consumer can verify the package came from this repository and not from someone's laptop.
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
