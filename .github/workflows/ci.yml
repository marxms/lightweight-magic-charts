# The gate, run on the same commands a contributor runs locally.
#
# WHY THESE AND NOT A GENERIC "lint, test, build": this library's guarantees are enforced BY the
# suite — the language gate, the derived-reference gate, the size budget and the boundary checks all
# live in `npm test`. A CI that ran something else would be weaker than the local gate, and a gate
# that can be weaker than the developer's own run is not a gate.
#
# ACTIONS ARE PINNED BY COMMIT, not by tag. A tag is a moving pointer its owner can repoint, and
# `release.yml` reuses these same actions in the job that holds the npm token — so a repointed tag
# there is a supply-chain compromise, not an inconvenience. The version is in the comment.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # NOT fail-fast. The reason is measured: `10 ** -4` is 0.0001 on one Node and
      # 0.00009999999999999999 on another, and that defect reached master because one version was
      # the only version. Cancelling the siblings the moment one fails would hide exactly that.
      fail-fast: false
      matrix:
        # Every Node still supported upstream on 2026-08-16: 22 (Jod, LTS to 2027-04), 24 (Krypton,
        # LTS to 2028-04), 26 (current, LTS from 2026-10). Node 20 is deliberately absent — it went
        # end-of-life on 2026-04-30, and gating on an unsupported runtime tests nobody's install.
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # This job never writes to the repository, so it has no use for a credential in the
          # workspace. Only the publish job asks for one, and only to record its tag.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # BUILD FIRST. The size budget and the derived reference both measure the BUILT entry, so a
      # suite run against a stale `dist` would assert against an artefact nobody is shipping.
      - name: Build
        run: npm run build

      - name: Suite (includes the language, reference, boundary and size-budget gates)
        run: npm test

      # The published tarball is part of the contract: `files` promises paths, and a promise that
      # resolves to nothing is a broken install for whoever consumes it. The check lives in a script
      # so the release workflow and a contributor can run the SAME one — see the script's docblock.
      - name: Pack, and prove every promised path exists
        run: |
          npm pack --dry-run
          node scripts/verify-package-paths.mjs

  # THE OWNER'S ACCEPTANCE CONDITION, RUN BEFORE HE RUNS IT. His words: "my first action when you
  # finish will be to test every indicator and make sure they respect the parameterisations and that
  # they are correctly calculated". `scripts/indicator-proof.mjs` is those two claims made checkable
  # against the committed manifest — see its own docblock for what it verifies and what it refuses
  # to claim.
  #
  # ITS OWN JOB, NOT PART OF `gate`, for the same reason `e2e` is its own: it loads a 1.05 MB
  # third-party library and computes three hundred indicators over 1664 bars. MEASURED at 11.2 s on
  # 2026-08-21 against `npm test`'s ~15 s over three Node versions — and none of what it measures
  # varies by Node runtime, only by the vendor version, which `package.json` pins EXACTLY. Paying
  # for it three times would prove the same number three times.
  #
  # It does NOT build. It reads `example/indicators/manifest.json` and the vendor directly; nothing
  # under `src/` is involved, and `test/boundary.spec.ts` is what keeps it that way.
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # The lowest Node this package still supports. The vendor's arithmetic is what this job
          # measures, and it does not depend on which supported Node runs it.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Indicator proof (parameterisation sensor + correctness oracles + manifest)
        run: npm run proof

      # THE COMMITTED CATALOGUE IS THE GENERATOR'S OUTPUT, or it is stale. `--check` derives it
      # again and writes nothing: an edit by hand, or a vendor release the manifest has not been
      # regenerated against, fails here rather than being discovered by a visitor.
      - name: The catalogue is what the generator produces
        run: node scripts/build-indicator-manifest.mjs --check

  # THE ONLY JOB THAT RENDERS A PIXEL. `gate` runs 1198+ cases and none of them mount `example/` —
  # `jest.config.js`'s own docblock explains why `testEnvironment` stays browser-free by default. On
  # 2026-08-16 that gap let seven defects reach `example/` at once (an empty volume pane, an empty
  # studies panel, a heatmap that painted nothing, a drawing tool that armed and never drew, a price
  # alert that could not be removed, four of six chosen studies not plotting, and drawing glyphs
  # rendered as an empty box) — every one of them green across the whole matrix above, because none
  # of it looks at a canvas. `scripts/e2e-demo.mjs` does; see its own docblock for what it asserts
  # and, as deliberately, what it refuses to (no pixel-count or screenshot-equals-golden-file check —
  # every assertion is a legend number, a `data-testid` counter, or a canvas checksum compared
  # against a captured control state).
  #
  # ITS OWN JOB, NOT A MATRIX. None of what this measures — a legend value, a drawing count, a canvas
  # checksum — varies by Node runtime, only by browser and markup, both constant across Node
  # versions. Paying for a Chromium download three times to prove that three times would be the
  # `layout-probe` mistake this repository already named once: a real measurement that costs more
  # than it needs to run nobody keeps running.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # The lowest Node this package still supports (see `engines` in `package.json`) — the
          # browser and the markup are what this job measures, and neither depends on which
          # supported Node runs the driver.
          node-version: 22
          cache: npm

      - run: npm ci

      # `playwright-core` is already a devDependency (it drives `scripts/layout-probe.mjs` too); the
      # browser itself is fetched here rather than committed, same reasoning as that probe's own.
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      - name: E2E demo suite
        run: npm run e2e
